name: Check for artifact and register release

on:
  workflow_run:
    workflows: ["Maven Release"]
    types:
      - completed

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-check-and-register-release.yml@v3.0.3
    if:  "${{ github.event.workflow_run.conclusion == 'success' }}"
    with:
      artifact-pattern: "octopus/releng/versions-api/_VER_/versions-api-_VER_.jar"
    secrets: inherit
